<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riddle Quest</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #facc15;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: .5rem;
      color: var(--accent);
    }
    p { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .riddle {
      background: var(--bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      font-style: italic;
      line-height: 1.6;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .riddle.error { font-style: normal; color: var(--text); text-align: left; }
    .input-row {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.25rem;
    }
    .hint-row {
      display: flex;
      gap: .5rem;
      margin-bottom: .75rem;
      align-items: center;
    }
    .hint-btn {
      background: transparent;
      border: 1px solid #334155;
      color: var(--muted);
      border-radius: 8px;
      padding: .5rem 1rem;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .hint-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .hint-btn:disabled { opacity: .4; cursor: not-allowed; }
    .hint-text {
      flex: 1;
      font-size: .85rem;
      color: var(--accent);
      font-style: italic;
      text-align: left;
      min-height: 1.2rem;
    }
    .input-row label {
      font-size: .85rem;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .7rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(250,204,21,.15);
    }
    input[type="text"]:disabled { opacity: .5; cursor: not-allowed; }
    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: .75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(250,204,21,.3);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .count {
      font-size: .8rem;
      color: var(--muted);
      margin: 1rem 0 0;
    }
    .progress-wrap { margin-bottom: 1.5rem; }
    .progress-label {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .4rem;
      text-align: left;
    }
    .feedback {
      min-height: 1.5rem;
      margin-top: .75rem;
      font-size: .9rem;
      font-weight: 600;
    }
    .feedback.correct { color: #4ade80; }
    .feedback.wrong { color: #f87171; }
    .progress-track {
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #fde047);
      border-radius: 999px;
      transition: width .3s ease;
    }
    .progress-wrap.complete .progress-fill { background: linear-gradient(90deg, #22c55e, #4ade80); }
    /* ── Age group selector ── */
    .age-select {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.5rem;
    }
    .age-btn {
      flex: 1;
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .6rem .5rem;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .age-btn:hover { border-color: var(--accent); color: var(--text); }
    .age-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1><img src="assets/ridley_portrait.png" alt="Riddle Monster" width="48" height="48" style="border-radius:50%;vertical-align:middle;margin-right:.4rem;" /> Riddle Quest</h1>
    <p>Can you solve today's riddle?</p>

    <div class="age-select" id="ageSelect">
      <button class="age-btn" data-age="all">All</button>
      <button class="age-btn active" data-age="under10">Kids &lt; 10</button>
      <button class="age-btn" data-age="over10">Kids 10+</button>
    </div>

    <div class="riddle" id="riddle">Loading riddles…</div>
    <div class="feedback" id="feedback"></div>
    <div class="hint-row">
      <button class="hint-btn" id="hintBtn" disabled>💡 Hint</button>
      <span class="hint-text" id="hintText"></span>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel">0 / 10 solved</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="input-row">
      <label for="answerInput">Your answer:</label>
      <input type="text" id="answerInput" placeholder="Type your answer…" autocomplete="off" disabled />
    </div>
    <button id="nextBtn" disabled>Check Answer</button>
    <p class="count" id="count"></p>
  </main>

  <script>
    const el = document.getElementById("riddle");
    const btn = document.getElementById("nextBtn");
    const input = document.getElementById("answerInput");
    const countEl = document.getElementById("count");
    const feedbackEl = document.getElementById("feedback");
    const ageSelect = document.getElementById("ageSelect");
    const hintBtn = document.getElementById("hintBtn");
    const hintText = document.getElementById("hintText");

    let allRiddles = { under10: [], over10: [] };
    let riddles = [];
    let i = 0;
    let revealed = false;
    let currentAge = "under10";

    // ---------- Progress ----------
    const GOAL = 10;
    let solved = 0;
    let wasCorrect = false;
    let complete = false;
    const progressWrap = document.getElementById("progressWrap");
    const progressLabel = document.getElementById("progressLabel");
    const progressFill = document.getElementById("progressFill");

    function updateProgress() {
      const pct = Math.round((solved / GOAL) * 100);
      progressFill.style.width = pct + "%";
      progressLabel.textContent = solved + " / " + GOAL + " solved";
    }

    function showLevelComplete() {
      complete = true;
      progressWrap.classList.add("complete");
      el.textContent = "🎉 Level complete! You solved " + GOAL + " riddles. Nice work.";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      hintText.textContent = "";
      hintBtn.disabled = true;
      btn.textContent = "Play Again";
      btn.disabled = false;
      input.disabled = true;
    }

    function resetGame() {
      complete = false;
      solved = 0;
      i = 0;
      shuffleDeck();
      progressWrap.classList.remove("complete");
      updateProgress();
      render();
    }

    function shuffleDeck() {
      for (let n = riddles.length - 1; n > 0; n--) {
        const m = Math.floor(Math.random() * (n + 1));
        [riddles[n], riddles[m]] = [riddles[m], riddles[n]];
      }
    }

    // ---------- Age group selector ----------
    function selectAge(age) {
      currentAge = age;
      // Update active button
      ageSelect.querySelectorAll(".age-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.age === age);
      });
      // Build the deck for this age
      if (age === "all") {
        riddles = allRiddles.under10.concat(allRiddles.over10);
      } else {
        riddles = allRiddles[age];
      }
      // Reset game state
      complete = false;
      solved = 0;
      i = 0;
      wasCorrect = false;
      progressWrap.classList.remove("complete");
      countEl.textContent = riddles.length + " riddles (" + age + ")";
      shuffleDeck();
      updateProgress();
      render();
    }

    ageSelect.addEventListener("click", (e) => {
      const btn = e.target.closest(".age-btn");
      if (btn) selectAge(btn.dataset.age);
    });

    // ---------- Load ----------
    async function loadRiddles() {
      if (location.protocol === "file:") throw new Error("FILE_PROTOCOL");
      const res = await fetch("data/riddles-categorized.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      // Normalize: ensure each entry has q and a (carry hint through if present)
      const normalize = (arr) => arr
      .map(r => ({ q: r.q, a: r.a, hint: (r.hint || "").trim() }))
      .filter(r => r.q && r.a);
      return {
        under10: normalize(data.under10 || []),
        over10: normalize(data.over10 || [])
      };
    }

    function render() {
      el.textContent = riddles[i].q;
      el.classList.remove("error");
      el.style.whiteSpace = "";
      btn.textContent = "Check Answer";
      btn.disabled = false;
      input.disabled = false;
      updateProgress();
      input.value = "";
      input.placeholder = "Type your answer…";
      revealed = false;
      wasCorrect = false;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      hintText.textContent = "";
      hintBtn.disabled = false;
      hintBtn.textContent = "💡 Hint";
    }

    function showFatal(msg) {
      el.textContent = msg;
      el.classList.add("error");
      el.style.whiteSpace = "pre-line";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      hintText.textContent = "";
      hintBtn.disabled = true;
      btn.disabled = true;
      input.disabled = true;
    }

    function showHint() {
      if (hintText.textContent) return; // already shown
      hintText.textContent = riddles[i].hint || "(no hint for this riddle)";
      hintBtn.disabled = true;
      hintBtn.textContent = "💡 Shown";
    }

    hintBtn.addEventListener("click", showHint);

    function revealAnswer() {
      wasCorrect = false;
      el.textContent = "Answer: " + riddles[i].a;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      input.disabled = true;
      hintBtn.disabled = true;
      btn.textContent = "Next Riddle";
      btn.disabled = false;
    }

    function checkAnswer() {
      const guess = input.value.trim().toLowerCase();
      const correct = riddles[i].a.trim().toLowerCase();
      if (guess === correct) {
        wasCorrect = true;
        el.textContent = "✅ Correct!  Answer: " + riddles[i].a;
        feedbackEl.textContent = "Nice work!";
        feedbackEl.className = "feedback correct";
        input.disabled = true;
        hintBtn.disabled = true;
        btn.textContent = "Next Riddle";
        btn.disabled = false;
      } else {
        feedbackEl.textContent = "❌ Not quite — try again, or leave it blank and click Reveal.";
        feedbackEl.className = "feedback wrong";
        btn.textContent = "Reveal";
      }
    }

    // ---------- Button state machine ----------
    btn.addEventListener("click", () => {
      if (!riddles.length) return;
      if (complete) { resetGame(); return; }

      const label = btn.textContent;

      if (label === "Check Answer" || label === "Reveal") {
        const guess = input.value.trim();
        if (guess) {
          checkAnswer();
        } else {
          revealAnswer();
        }
      } else if (label === "Next Riddle") {
        if (wasCorrect) {
          solved = Math.min(solved + 1, GOAL);
        }
        if (solved >= GOAL) {
          updateProgress();
          showLevelComplete();
        } else {
          i = (i + 1) % riddles.length;
          render();
        }
      }
    });

    // Enter key
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !input.disabled) {
        e.preventDefault();
        btn.click();
      }
    });

    // ---------- Init ----------
    loadRiddles()
      .then(data => {
        allRiddles = data;
        const total = allRiddles.under10.length + allRiddles.over10.length;
        if (!total) { showFatal("The riddles file loaded but contained no valid riddles."); return; }
        // Default to under10
        selectAge("under10");
      })
      .catch(err => {
        if (err.message === "FILE_PROTOCOL") {
          showFatal("This page must be served over HTTP to read its data file.\n\nStart a local server in this folder, then reload:\n  python3 -m http.server 8000\n  → http://localhost:8000");
        } else {
          showFatal("Could not load riddles-categorized.json (" + err.message + ").");
        }
      });
  </script>
</body>
</html>
