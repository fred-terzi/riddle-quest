<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riddle Quest</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #facc15;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: .5rem;
      color: var(--accent);
    }
    p { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .riddle {
      background: var(--bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      font-style: italic;
      line-height: 1.6;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .riddle.error { font-style: normal; color: var(--text); text-align: left; }
    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-stage.hidden { display: none; }
    .video-stage video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, .55);
      cursor: pointer;
      border: none;
      border-radius: 12px;
    }
    .start-overlay.hidden { display: none; }
    .start-overlay .play-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.5);
      padding: 0 0 0 .15rem;
      transition: transform .15s;
    }
    .start-overlay:hover .play-btn { transform: scale(1.08); }
    .input-row {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.25rem;
    }
    .hint-row {
      display: flex;
      gap: .5rem;
      margin-bottom: .75rem;
      align-items: center;
    }
    .hint-btn {
      background: transparent;
      border: 1px solid #334155;
      color: var(--muted);
      border-radius: 8px;
      padding: .5rem 1rem;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .hint-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .hint-btn:disabled { opacity: .4; cursor: not-allowed; }
    .hint-text {
      flex: 1;
      font-size: .85rem;
      color: var(--accent);
      font-style: italic;
      text-align: left;
      min-height: 1.2rem;
    }
    .input-row label {
      font-size: .85rem;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .7rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(250,204,21,.15);
    }
    input[type="text"]:disabled { opacity: .5; cursor: not-allowed; }
    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: .75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(250,204,21,.3);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .count {
      font-size: .8rem;
      color: var(--muted);
      margin: 1rem 0 0;
    }
    .progress-wrap { margin-bottom: 1.5rem; }
    .progress-label {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .4rem;
      text-align: left;
    }
    .feedback {
      min-height: 1.5rem;
      margin-top: .75rem;
      font-size: .9rem;
      font-weight: 600;
    }
    .feedback.correct { color: #4ade80; }
    .feedback.wrong { color: #f87171; }
    .progress-track {
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #fde047);
      border-radius: 999px;
      transition: width .3s ease;
    }
    .progress-wrap.complete .progress-fill { background: linear-gradient(90deg, #22c55e, #4ade80); }
    /* ── Age group selector ── */
    .age-select {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.5rem;
    }
    .age-btn {
      flex: 1;
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .6rem .5rem;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .age-btn:hover { border-color: var(--accent); color: var(--text); }
    .age-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1><img src="assets/ridley_portrait.png" alt="Riddle Monster" width="48" height="48" style="border-radius:50%;vertical-align:middle;margin-right:.4rem;" /> Riddle Quest</h1>
    <p>Can you solve today's riddle?</p>

    <div class="age-select" id="ageSelect">
      <button class="age-btn" data-age="all">All</button>
      <button class="age-btn active" data-age="under10">Kids &lt; 10</button>
      <button class="age-btn" data-age="over10">Kids 10+</button>
    </div>

    <div class="video-stage hidden" id="videoStage">
      <video id="stageVideo" playsinline preload="none"></video>
      <button class="start-overlay hidden" id="startOverlay" aria-label="Play with sound">
        <span class="play-btn">▶</span>
      </button>
    </div>

    <div class="riddle" id="riddle">Loading riddles…</div>
    <div class="feedback" id="feedback"></div>
    <div class="hint-row">
      <button class="hint-btn" id="hintBtn" disabled>💡 Hint</button>
      <span class="hint-text" id="hintText"></span>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel">0 / 10 solved</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="input-row">
      <label for="answerInput">Your answer:</label>
      <input type="text" id="answerInput" placeholder="Type your answer…" autocomplete="off" disabled />
    </div>
    <button id="nextBtn" disabled>Check Answer</button>
    <p class="count" id="count"></p>
  </main>

  <script src="assets/videos/engine.js"></script>
  <script>
    const el = document.getElementById("riddle");
    const btn = document.getElementById("nextBtn");
    const input = document.getElementById("answerInput");
    const countEl = document.getElementById("count");
    const feedbackEl = document.getElementById("feedback");
    const ageSelect = document.getElementById("ageSelect");
    const hintBtn = document.getElementById("hintBtn");
    const hintText = document.getElementById("hintText");
    const videoStage = document.getElementById("videoStage");
    const stageVideo = document.getElementById("stageVideo");
    const startOverlay = document.getElementById("startOverlay");
    VideoEngine.init({ stageEl: stageVideo });

    let allRiddles = { under10: [], over10: [] };
    let riddles = [];
    let i = 0;
    let revealed = false;
    let currentAge = "under10";

    // ---------- Progress ----------
    const GOAL = 10;
    let solved = 0;
    let wasCorrect = false;
    let complete = false;
    const progressWrap = document.getElementById("progressWrap");
    const progressLabel = document.getElementById("progressLabel");
    const progressFill = document.getElementById("progressFill");

    function updateProgress() {
      const pct = Math.round((solved / GOAL) * 100);
      progressFill.style.width = pct + "%";
      progressLabel.textContent = solved + " / " + GOAL + " solved";
    }

    function showLevelComplete() {
      complete = true;
      progressWrap.classList.add("complete");
      el.textContent = "🎉 Level complete! You solved " + GOAL + " riddles. Nice work.";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      hintText.textContent = "";
      hintBtn.disabled = true;
      btn.textContent = "Play Again";
      btn.disabled = false;
      input.disabled = true;
      setStageVisible(false);
      VideoEngine.stop();
    }

    function resetGame() {
      complete = false;
      solved = 0;
      i = 0;
      wasCorrect = false;
      progressWrap.classList.remove("complete");
      setupDeck();
      updateProgress();
      render();
    }

    // ---------- Age group selector ----------
    function selectAge(age) {
      currentAge = age;
      // Update active button
      ageSelect.querySelectorAll(".age-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.age === age);
      });
      // Reset game state (setupDeck rebuilds the deck with the video riddles pinned first)
      complete = false;
      solved = 0;
      i = 0;
      wasCorrect = false;
      progressWrap.classList.remove("complete");
      setupDeck();
      countEl.textContent = riddles.length + " riddles (" + age + ")";
      updateProgress();
      render();
    }

    ageSelect.addEventListener("click", (e) => {
      const btn = e.target.closest(".age-btn");
      if (btn) selectAge(btn.dataset.age);
    });

    // ---------- Video pilot (riddles 1–3, videoSet 1..3) ----------
    // The three video riddles (first three under-10 entries) always open the
    // deck, in order, unshuffled. Everything else is shuffled after them.
    const VIDEO_RIDDLES = 3;

    function setupDeck() {
      // same source list selectAge used, rebuilt so we can reorder it
      const source = currentAge === "all"
        ? allRiddles.under10.concat(allRiddles.over10)
        : allRiddles[currentAge] || [];
      const video = source.filter(r => r.videoSet).slice(0, VIDEO_RIDDLES);
      const rest = source.filter(r => !video.includes(r));
      // Fisher-Yates the non-video tail only
      for (let m = rest.length - 1; m > 0; m--) {
        const k = Math.floor(Math.random() * (m + 1));
        [rest[m], rest[k]] = [rest[k], rest[m]];
      }
      riddles = video.concat(rest);
      // keep i on the same riddle object after reordering
      if (!complete) {
        const cur = riddles[i];
        const found = cur ? riddles.indexOf(cur) : 0;
        i = found >= 0 ? found : 0;
      }
    }

    function currentHasVideo() {
      const r = riddles[i];
      return !!(r && r.videoSet);
    }

    function setStageVisible(visible) {
      videoStage.classList.toggle("hidden", !visible);
    }

    function startVideoFlow() {
      const n = riddles[i].videoSet;
      input.disabled = true;      // typing opens only once the character is waiting
      hintBtn.disabled = true;
      btn.disabled = false;
      // The overlay is hidden by the click handler (the user gesture that
      // satisfies autoplay policy), not on the play() promise — so a
      // rejected play() can't leave the ▶ button frozen on screen.
      VideoEngine.playSequence([VideoEngine.clips.welcome, VideoEngine.clips.riddle(n)]);
      hintText.textContent = ""; // hint (if requested) lands when he's done
    }

    // when the stream settles into the muted waiting loop, the riddle is "live":
    // input + hint open (unless the riddle is already resolved), and any
    // requested hint text lands on screen.
    VideoEngine.setOnWaitingStart(() => {
      const resolved = btn.textContent === "Next Riddle";
      input.disabled = resolved;
      if (!hintText.textContent && hintBtn.textContent.indexOf("Shown") >= 0) {
        hintText.textContent = riddles[i].hint || "(no hint for this riddle)";
      }
      hintBtn.disabled = resolved || !!hintText.textContent;
    });

    function playWithSet(lead, clipFn) {
      const n = riddles[i].videoSet;
      VideoEngine.playSequence([lead, clipFn(n)]);
    }

    function showStartOverlay() {
      // park on the first frame of the riddle clip behind a ▶ button.
      // Use a one-shot listener so a late loadeddata can't re-seek the video
      // mid-playback and race with playSequence() from the click handler.
      const n = riddles[i].videoSet;
      videoStage.classList.remove("hidden");
      startOverlay.classList.remove("hidden");
      stageVideo.removeAttribute("muted");
      stageVideo.src = VideoEngine.clips.riddle(n);
      const onLoaded = () => {
        try { stageVideo.currentTime = 0.05; } catch (e) {}
      };
      stageVideo.addEventListener("loadeddata", onLoaded, { once: true });
    }

    startOverlay.addEventListener("click", () => {
      if (!currentHasVideo()) return;
      // Hide the overlay synchronously with the click. This is the user
      // gesture that unlocks audio; deferring it to the play() promise
      // meant an autoplay rejection left the ▶ button frozen over the
      // black stage.
      startOverlay.classList.add("hidden");
      startVideoFlow();
    });

    // tiny test/debug handle (harmless in the game UI)
    window.__rq = {
      videoStage: () => !videoStage.classList.contains("hidden"),
      currentSrc: () => stageVideo.currentSrc ? stageVideo.currentSrc.split("/").slice(-2).join("/") : "",
      muted: () => stageVideo.muted,
      engineMode: () => VideoEngine.isWaiting() ? "waiting" : (stageVideo.paused ? "idle" : "playing"),
      clickStart: () => startOverlay.click(),
      advance: () => { const c = stageVideo.currentTime || 0; stageVideo.currentTime = Math.max(c, (stageVideo.duration || 1) - 0.01); },
      fireEnded: () => stageVideo.dispatchEvent(new Event("ended"))
    };

    // ---------- Load ----------
    async function loadRiddles() {
      if (location.protocol === "file:") throw new Error("FILE_PROTOCOL");
      const res = await fetch("data/riddles-categorized.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      // Normalize: ensure each entry has q and a (carry hint/videoSet through if present)
      const normalize = (arr) => arr
      .map(r => ({
        q: r.q,
        a: r.a,
        hint: (r.hint || "").trim(),
        videoSet: (r.videoSet ? Number(r.videoSet) : null)
      }))
      .filter(r => r.q && r.a);
      return {
        under10: normalize(data.under10 || []),
        over10: normalize(data.over10 || [])
      };
    }

    function render() {
      el.textContent = riddles[i].q;
      el.classList.remove("error");
      el.style.whiteSpace = "";
      btn.textContent = "Check Answer";
      btn.disabled = false;
      input.disabled = false;
      updateProgress();
      input.value = "";
      input.placeholder = "Type your answer…";
      revealed = false;
      wasCorrect = false;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      hintText.textContent = "";
      hintBtn.disabled = false;
      hintBtn.textContent = "💡 Hint";
      // ---- video stage ----
      if (currentHasVideo() && !complete) {
        setStageVisible(true);
        showStartOverlay(); // ▶ with sound, then the character opens the riddle
        // park state: no audio until the player presses play
        input.disabled = true;
        hintBtn.disabled = true;
        btn.disabled = true;
      } else {
        setStageVisible(false);
        VideoEngine.stop(); // text-only riddle: cut the character off
      }
    }

    function showFatal(msg) {
      el.textContent = msg;
      el.classList.add("error");
      el.style.whiteSpace = "pre-line";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      hintText.textContent = "";
      hintBtn.disabled = true;
      btn.disabled = true;
      input.disabled = true;
    }

    function showHint() {
      if (hintText.textContent) return; // already shown
      hintBtn.textContent = "💡 Shown";
      if (currentHasVideo()) {
        // character delivers the hint on video; the text lands when he's done
        hintBtn.disabled = true;
        playWithSet(VideoEngine.clips.heresAHint, VideoEngine.clips.hint);
        return;
      }
      hintText.textContent = riddles[i].hint || "(no hint for this riddle)";
      hintBtn.disabled = true;
    }

    hintBtn.addEventListener("click", showHint);

    function revealAnswer() {
      wasCorrect = false;
      el.textContent = "Answer: " + riddles[i].a;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      input.disabled = true;
      hintBtn.disabled = true;
      btn.textContent = "Next Riddle";
      btn.disabled = false;
      if (currentHasVideo()) playWithSet(VideoEngine.clips.theAnswerIs, VideoEngine.clips.answer);
    }

    function checkAnswer() {
      const guess = input.value.trim().toLowerCase();
      const correct = riddles[i].a.trim().toLowerCase();
      if (guess === correct) {
        wasCorrect = true;
        el.textContent = "✅ Correct!  Answer: " + riddles[i].a;
        feedbackEl.textContent = "Nice work!";
        feedbackEl.className = "feedback correct";
        input.disabled = true;
        hintBtn.disabled = true;
        btn.textContent = "Next Riddle";
        btn.disabled = false;
        if (currentHasVideo()) playWithSet(VideoEngine.clips.theAnswerIs, VideoEngine.clips.answer);
      } else {
        feedbackEl.textContent = "❌ Not quite — try again, or leave it blank and click Reveal.";
        feedbackEl.className = "feedback wrong";
        btn.textContent = "Reveal";
        if (currentHasVideo()) playWithSet(VideoEngine.clips.tryAgain, VideoEngine.clips.riddle);
      }
    }

    // ---------- Button state machine ----------
    btn.addEventListener("click", () => {
      if (!riddles.length) return;
      if (complete) { resetGame(); return; }

      const label = btn.textContent;

      if (label === "Check Answer" || label === "Reveal") {
        const guess = input.value.trim();
        if (guess) {
          checkAnswer();
        } else {
          revealAnswer();
        }
      } else if (label === "Next Riddle") {
        if (wasCorrect) {
          solved = Math.min(solved + 1, GOAL);
        }
        if (solved >= GOAL) {
          updateProgress();
          showLevelComplete();
        } else {
          i = (i + 1) % riddles.length;
          render();
        }
      }
    });

    // Enter key
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !input.disabled) {
        e.preventDefault();
        btn.click();
      }
    });

    // ---------- Init ----------
    loadRiddles()
      .then(data => {
        allRiddles = data;
        const total = allRiddles.under10.length + allRiddles.over10.length;
        if (!total) { showFatal("The riddles file loaded but contained no valid riddles."); return; }
        // Default to under10
        selectAge("under10");
      })
      .catch(err => {
        if (err.message === "FILE_PROTOCOL") {
          showFatal("This page must be served over HTTP to read its data file.\n\nStart a local server in this folder, then reload:\n  python3 -m http.server 8000\n  → http://localhost:8000");
        } else {
          showFatal("Could not load riddles-categorized.json (" + err.message + ").");
        }
      });
  </script>
</body>
</html>
