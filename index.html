<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riddle Quest</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #facc15;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: .5rem;
      color: var(--accent);
    }
    p { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .riddle {
      background: var(--bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      font-style: italic;
      line-height: 1.6;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .riddle.error { font-style: normal; color: var(--text); text-align: left; }
    .input-row {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.25rem;
    }
    .input-row label {
      font-size: .85rem;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .7rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(250,204,21,.15);
    }
    input[type="text"]:disabled { opacity: .5; cursor: not-allowed; }
    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: .75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(250,204,21,.3);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .count {
      font-size: .8rem;
      color: var(--muted);
      margin: 1rem 0 0;
    }
    .progress-wrap { margin-bottom: 1.5rem; }
    .progress-label {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .4rem;
      text-align: left;
    }
    .progress-track {
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #fde047);
      border-radius: 999px;
      transition: width .3s ease;
    }
    .progress-wrap.complete .progress-fill { background: linear-gradient(90deg, #22c55e, #4ade80); }
  </style>
</head>
<body>
  <main class="card">
    <h1>🧩 Riddle Quest</h1>
    <p>Can you solve today's riddle?</p>
    <div class="riddle" id="riddle">Loading riddles…</div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel">0 / 10 answered</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="input-row">
      <label for="answerInput">Your answer:</label>
      <input type="text" id="answerInput" placeholder="Type your answer…" autocomplete="off" disabled />
    </div>
    <button id="nextBtn" disabled>Reveal Answer</button>
    <p class="count" id="count"></p>
  </main>

  <script>
    const el = document.getElementById("riddle");
    const btn = document.getElementById("nextBtn");
    const input = document.getElementById("answerInput");
    const countEl = document.getElementById("count");
    let riddles = [];
    let i = 0;
    let revealed = false;

    // ---------- Progress (GUI only — no correctness check yet) ----------
    const GOAL = 10;      // riddles answered to complete the level
    let solved = 0;       // how many the user has answered
    let complete = false; // level finished state
    const progressWrap = document.getElementById("progressWrap");
    const progressLabel = document.getElementById("progressLabel");
    const progressFill = document.getElementById("progressFill");

    function updateProgress() {
      const pct = Math.round((solved / GOAL) * 100);
      progressFill.style.width = pct + "%";
      progressLabel.textContent = solved + " / " + GOAL + " answered";
    }

    function showLevelComplete() {
      complete = true;
      progressWrap.classList.add("complete");
      el.textContent = "🎉 Level complete! You answered " + GOAL + " riddles. Nice work.";
      btn.textContent = "Play Again";
      btn.disabled = false;
      input.disabled = true;
    }

    function resetGame() {
      complete = false;
      solved = 0;
      i = 0;
      progressWrap.classList.remove("complete");
      updateProgress();
      render();
    }

    // ---------- CSV parser (RFC 4180: quoted fields, commas inside quotes) ----------
    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let idx = 0; idx < text.length; idx++) {
        const c = text[idx];
        if (inQuotes) {
          if (c === '"') {
            if (text[idx + 1] === '"') { field += '"'; idx++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field); field = "";
        } else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[idx + 1] === '\n') idx++;
          row.push(field); field = "";
          rows.push(row); row = [];
        } else {
          field += c;
        }
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    // CSV text -> array of { q, a }, matched by header name with index fallback
    function toRiddles(text) {
      const rows = parseCSV(text);
      if (!rows.length) return [];
      const header = rows[0].map(h => h.trim().toLowerCase());
      const qi = header.indexOf("questions") >= 0 ? header.indexOf("questions") : 0;
      const ai = header.indexOf("answers") >= 0 ? header.indexOf("answers") : 1;
      return rows.slice(1)
        .map(r => ({ q: (r[qi] || "").trim(), a: (r[ai] || "").trim() }))
        .filter(r => r.q && r.a);
    }

    // ---------- Load ----------
    async function loadRiddles() {
      if (location.protocol === "file:") throw new Error("FILE_PROTOCOL");
      const res = await fetch("data/riddles.csv", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return toRiddles(await res.text());
    }

    function render() {
      el.textContent = riddles[i].q;
      el.classList.remove("error");
      el.style.whiteSpace = "";
      btn.textContent = "Reveal Answer";
      btn.disabled = false;
      input.disabled = false;
      updateProgress();
      input.value = "";
      input.placeholder = "Type your answer…";
      revealed = false;
    }

    function showFatal(msg) {
      el.textContent = msg;
      el.classList.add("error");
      el.style.whiteSpace = "pre-line";
      btn.disabled = true;
      input.disabled = true;
    }

    btn.addEventListener("click", () => {
      if (!riddles.length) return;
      if (complete) { resetGame(); return; }
      if (!revealed) {
        el.textContent = "Answer: " + riddles[i].a;
        btn.textContent = "Next Riddle";
        revealed = true;
      } else {
        solved = Math.min(solved + 1, GOAL);
        if (solved >= GOAL) {
          updateProgress();
          showLevelComplete();
        } else {
          i = (i + 1) % riddles.length;
          render();
        }
      }
    });

    loadRiddles()
      .then(list => {
        if (!list.length) { showFatal("The riddles file loaded but contained no valid riddles."); return; }
        riddles = list;
        countEl.textContent = list.length + " riddles loaded from data/riddles.csv";
        render();
      })
      .catch(err => {
        if (err.message === "FILE_PROTOCOL") {
          showFatal("This page must be served over HTTP to read its data file.\n\nStart a local server in this folder, then reload:\n  python3 -m http.server 8000\n  → http://localhost:8000");
        } else {
          showFatal("Could not load riddles.csv (" + err.message + ").");
        }
      });
  </script>
</body>
</html>
