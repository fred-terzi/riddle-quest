<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riddle Quest</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #facc15;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: .5rem;
      color: var(--accent);
    }
    p { color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .riddle {
      background: var(--bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      font-style: italic;
      line-height: 1.6;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .riddle.error { font-style: normal; color: var(--text); text-align: left; }
    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: .75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(250,204,21,.3);
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .count {
      font-size: .8rem;
      color: var(--muted);
      margin: 1rem 0 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🧩 Riddle Quest</h1>
    <p>Can you solve today's riddle?</p>
    <div class="riddle" id="riddle">Loading riddles…</div>
    <button id="nextBtn" disabled>Reveal Answer</button>
    <p class="count" id="count"></p>
  </main>

  <script>
    const el = document.getElementById("riddle");
    const btn = document.getElementById("nextBtn");
    const countEl = document.getElementById("count");
    let riddles = [];
    let i = 0;
    let revealed = false;

    // ---------- CSV parser (RFC 4180: quoted fields, commas inside quotes) ----------
    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let idx = 0; idx < text.length; idx++) {
        const c = text[idx];
        if (inQuotes) {
          if (c === '"') {
            if (text[idx + 1] === '"') { field += '"'; idx++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field); field = "";
        } else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[idx + 1] === '\n') idx++;
          row.push(field); field = "";
          rows.push(row); row = [];
        } else {
          field += c;
        }
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    // CSV text -> array of { q, a }, matched by header name with index fallback
    function toRiddles(text) {
      const rows = parseCSV(text);
      if (!rows.length) return [];
      const header = rows[0].map(h => h.trim().toLowerCase());
      const qi = header.indexOf("questions") >= 0 ? header.indexOf("questions") : 0;
      const ai = header.indexOf("answers") >= 0 ? header.indexOf("answers") : 1;
      return rows.slice(1)
        .map(r => ({ q: (r[qi] || "").trim(), a: (r[ai] || "").trim() }))
        .filter(r => r.q && r.a);
    }

    // ---------- Load ----------
    async function loadRiddles() {
      if (location.protocol === "file:") throw new Error("FILE_PROTOCOL");
      const res = await fetch("data/riddles.csv", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return toRiddles(await res.text());
    }

    function render() {
      el.textContent = riddles[i].q;
      el.classList.remove("error");
      el.style.whiteSpace = "";
      btn.textContent = "Reveal Answer";
      btn.disabled = false;
      revealed = false;
    }

    function showFatal(msg) {
      el.textContent = msg;
      el.classList.add("error");
      el.style.whiteSpace = "pre-line";
      btn.disabled = true;
    }

    btn.addEventListener("click", () => {
      if (!riddles.length) return;
      if (!revealed) {
        el.textContent = "Answer: " + riddles[i].a;
        btn.textContent = "Next Riddle";
        revealed = true;
      } else {
        i = (i + 1) % riddles.length;
        render();
      }
    });

    loadRiddles()
      .then(list => {
        if (!list.length) { showFatal("The riddles file loaded but contained no valid riddles."); return; }
        riddles = list;
        countEl.textContent = list.length + " riddles loaded from data/riddles.csv";
        render();
      })
      .catch(err => {
        if (err.message === "FILE_PROTOCOL") {
          showFatal("This page must be served over HTTP to read its data file.\n\nStart a local server in this folder, then reload:\n  python3 -m http.server 8000\n  → http://localhost:8000");
        } else {
          showFatal("Could not load riddles.csv (" + err.message + ").");
        }
      });
  </script>
</body>
</html>
